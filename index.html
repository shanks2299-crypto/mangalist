<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>قارئ المانجا</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--surface:#111118;--card:#18181f;--card2:#1e1e28;
  --accent:#e879f9;--accent2:#c026d3;--accent3:#7c3aed;
  --text:#f1f0f5;--muted:#6b7280;--border:#252530;
  --red:#ef4444;--green:#22c55e;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans Arabic',sans-serif}

/* ── LOCK ── */
#lock{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.lock-logo{font-family:'Bebas Neue',cursive;font-size:52px;letter-spacing:6px;direction:ltr;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lock-sub{color:var(--muted);font-size:14px}
#pin-dots{display:flex;gap:14px;direction:ltr}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);transition:all .2s}
.dot.filled{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(232,121,249,.5)}
#pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:230px}
.pin-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:16px;border-radius:12px;font-size:20px;cursor:pointer;transition:all .2s;font-family:inherit}
.pin-btn:hover{background:var(--accent2);border-color:var(--accent)}
.pin-btn:active{transform:scale(.95)}
.pin-btn.del{font-size:13px;color:var(--muted)}
.lock-err{color:var(--red);font-size:13px;min-height:18px}

/* ── LAYOUT ── */
#app{display:none;height:100vh;flex-direction:column}
#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:20}
.logo-sm{font-family:'Bebas Neue',cursive;font-size:24px;letter-spacing:3px;direction:ltr;background:linear-gradient(135deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.topbar-btns{display:flex;gap:8px;align-items:center}
.icon-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;transition:all .2s}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ── HOME ── */
#home{flex:1;overflow-y:auto;padding:24px}
.section-title{font-size:17px;font-weight:500;color:var(--accent);margin-bottom:16px;padding-right:10px;border-right:3px solid var(--accent)}
.manga-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-bottom:32px}
.manga-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .25s;position:relative}
.manga-card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 8px 28px rgba(192,38,211,.2)}
.manga-cover{width:100%;height:200px;object-fit:cover;display:block;background:var(--card2)}
.manga-cover-placeholder{width:100%;height:200px;display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,var(--card),var(--card2))}
.manga-info{padding:10px 12px}
.manga-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.manga-ch{font-size:11px;color:var(--muted)}
.progress-mini{height:2px;background:var(--border);border-radius:2px;margin-top:6px}
.progress-mini-fill{height:100%;background:var(--accent);border-radius:2px}

/* ── CHAPTER LIST ── */
#chapter-view{display:none;flex:1;overflow-y:auto;padding:20px}
.back-btn{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;margin-bottom:20px;transition:all .2s}
.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.chapter-header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.chapter-cover{width:80px;height:110px;border-radius:10px;object-fit:cover;background:var(--card2);flex-shrink:0}
.chapter-title{font-size:22px;font-weight:700;color:var(--accent)}
.chapter-sub{font-size:13px;color:var(--muted);margin-top:4px}
.chapters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.ch-btn{background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 8px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;transition:all .2s;text-align:center}
.ch-btn:hover{background:var(--accent2);border-color:var(--accent);color:#fff}
.ch-btn.read{border-color:var(--accent3);color:var(--accent3)}

/* ── READER ── */
#reader{display:none;flex-direction:column;flex:1;background:#000;overflow:hidden}
#reader-topbar{background:rgba(0,0,0,.9);padding:0 16px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid #222;backdrop-filter:blur(10px)}
#reader-title{font-size:13px;color:#aaa;direction:rtl}
.reader-nav{display:flex;gap:8px}
.rnav-btn{background:#222;border:1px solid #333;color:#ccc;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;transition:all .2s}
.rnav-btn:hover{background:#333;color:#fff}
#reader-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:0;background:#111}
.page-img{display:block;width:100%;max-width:800px;height:auto}
#reader-footer{background:rgba(0,0,0,.9);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-top:1px solid #222}
#page-counter{font-size:13px;color:#aaa}

/* ── LOADING ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:14px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── ADD MANGA MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:26px;width:100%;max-width:460px}
.modal h2{color:var(--accent);margin-bottom:20px;font-size:18px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.form-group input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:10px;font-family:inherit;font-size:14px;outline:none;direction:rtl}
.form-group input:focus{border-color:var(--accent)}
.form-group small{display:block;font-size:11px;color:var(--muted);margin-top:5px;direction:rtl;line-height:1.5}
.modal-btns{display:flex;gap:10px;margin-top:20px}
.btn-primary{background:var(--accent2);border:none;color:#fff;padding:11px 20px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;flex:1}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted);padding:11px 20px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px}
.btn-ghost:hover{border-color:var(--text);color:var(--text)}

.notif{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);color:var(--text);padding:11px 22px;border-radius:10px;z-index:9999;font-size:14px;animation:nfade .3s ease}
@keyframes nfade{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{font-size:52px;margin-bottom:12px}
.add-fab{position:fixed;bottom:24px;left:24px;background:var(--accent2);border:none;color:#fff;width:52px;height:52px;border-radius:50%;font-size:24px;cursor:pointer;box-shadow:0 4px 20px rgba(192,38,211,.5);z-index:40;transition:transform .2s}
.add-fab:hover{transform:scale(1.1)}
@media(max-width:500px){
  .manga-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  #reader-topbar{padding:0 10px}
  .rnav-btn{padding:5px 10px;font-size:12px}
}
</style>
</head>
<body>

<!-- LOCK -->
<div id="lock">
  <div class="lock-logo">MANGAREADER</div>
  <div class="lock-sub">مكتبتك الشخصية</div>
  <div id="pin-dots">
    <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
  </div>
  <div id="pin-pad">
    <button class="pin-btn" onclick="pp(1)">1</button>
    <button class="pin-btn" onclick="pp(2)">2</button>
    <button class="pin-btn" onclick="pp(3)">3</button>
    <button class="pin-btn" onclick="pp(4)">4</button>
    <button class="pin-btn" onclick="pp(5)">5</button>
    <button class="pin-btn" onclick="pp(6)">6</button>
    <button class="pin-btn" onclick="pp(7)">7</button>
    <button class="pin-btn" onclick="pp(8)">8</button>
    <button class="pin-btn" onclick="pp(9)">9</button>
    <button class="pin-btn del" onclick="pd()">مسح</button>
    <button class="pin-btn" onclick="pp(0)">0</button>
    <button class="pin-btn del" onclick="pc()">✕</button>
  </div>
  <div class="lock-err" id="pin-err"></div>
  <div style="color:var(--muted);font-size:12px">الرقم الافتراضي: 1234</div>
</div>

<!-- APP -->
<div id="app">
  <div id="topbar">
    <div class="logo-sm">MANGAREADER</div>
    <div class="topbar-btns">
      <button class="icon-btn" onclick="showAddModal()">+ أضف مانجا</button>
      <button class="icon-btn" onclick="logout()">خروج</button>
    </div>
  </div>

  <!-- HOME -->
  <div id="home">
    <div class="section-title" id="home-title">مكتبتي</div>
    <div id="manga-list"></div>
    <div class="empty-state" id="empty-msg" style="display:none">
      <div class="empty-icon">📚</div>
      <div style="margin-bottom:12px">مكتبتك فاضية</div>
      <div style="font-size:13px">اضغط "+ أضف مانجا" وأدخل رابط مجلد Google Drive</div>
    </div>
  </div>

  <!-- CHAPTER LIST -->
  <div id="chapter-view">
    <button class="back-btn" onclick="goHome()">← رجوع</button>
    <div class="chapter-header">
      <img id="cv-cover" class="chapter-cover" src="" onerror="this.style.display='none'"/>
      <div>
        <div class="chapter-title" id="cv-title"></div>
        <div class="chapter-sub" id="cv-sub"></div>
      </div>
    </div>
    <div class="chapters-grid" id="chapters-grid"></div>
  </div>

  <!-- READER -->
  <div id="reader">
    <div id="reader-topbar">
      <button class="rnav-btn" onclick="closeReader()">✕ إغلاق</button>
      <div id="reader-title"></div>
      <div class="reader-nav">
        <button class="rnav-btn" onclick="prevCh()">▶ السابق</button>
        <button class="rnav-btn" onclick="nextCh()">التالي ◀</button>
      </div>
    </div>
    <div id="reader-body"></div>
    <div id="reader-footer">
      <button class="rnav-btn" onclick="prevCh()">▶ فصل سابق</button>
      <span id="page-counter"></span>
      <button class="rnav-btn" onclick="nextCh()">فصل تالي ◀</button>
    </div>
  </div>
</div>

<!-- ADD MODAL -->
<div id="add-modal" style="display:none" class="modal-overlay" onclick="closeOutside(event)">
  <div class="modal">
    <h2>إضافة مانجا من Google Drive</h2>
    <div class="form-group">
      <label>اسم المانجا</label>
      <input type="text" id="m-name" placeholder="مثال: One Piece"/>
    </div>
    <div class="form-group">
      <label>رابط مجلد المانجا على Google Drive</label>
      <input type="text" id="m-url" placeholder="https://drive.google.com/drive/folders/..."/>
      <small>
        تأكد إن المجلد مشارك بـ "Anyone with the link"<br/>
        الترتيب: مجلد المانجا ← مجلدات الفصول (1، 2، 3...) ← صور كل فصل
      </small>
    </div>
    <div class="form-group">
      <label>رابط صورة الغلاف (اختياري)</label>
      <input type="text" id="m-cover" placeholder="https://..."/>
    </div>
    <div class="modal-btns">
      <button class="btn-primary" onclick="addManga()">إضافة</button>
      <button class="btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<button class="add-fab" onclick="showAddModal()">+</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKYghtbnO2J-WfbtD6Iz7j-wKf_Qr00QA",
  authDomain: "mangalist-7448a.firebaseapp.com",
  projectId: "mangalist-7448a",
  storageBucket: "mangalist-7448a.firebasestorage.app",
  messagingSenderId: "901886238323",
  appId: "1:901886238323:web:f475f03eca8c532904d406"
};

const fbApp = initializeApp(firebaseConfig);
const fsdb = getFirestore(fbApp);
const COLL = "manga_reader";
const PIN_KEY = "reader_pin_v1";
const API_KEY = "AIzaSyDKYghtbnO2J-WfbtD6Iz7j-wKf_Qr00QA";

let library = [];
let currentManga = null;
let currentChapters = [];
let currentChIndex = 0;
let currentPages = [];
let unsub = null;

// ── PIN ──
function getPin(){ return localStorage.getItem(PIN_KEY) || "1234"; }
let pinInput = "";
window.pp = n => { if(pinInput.length>=4)return; pinInput+=n; updateDots(); if(pinInput.length===4)setTimeout(checkPin,250); };
window.pd = () => { pinInput=pinInput.slice(0,-1); updateDots(); };
window.pc = () => { pinInput=""; updateDots(); };
function updateDots(){ for(let i=0;i<4;i++) document.getElementById("d"+i).classList.toggle("filled",i<pinInput.length); }
function checkPin(){
  if(pinInput===getPin()){
    document.getElementById("lock").style.display="none";
    document.getElementById("app").style.display="flex";
    startSync();
  } else {
    document.getElementById("pin-err").textContent="رقم السر غير صحيح";
    for(let i=0;i<4;i++) document.getElementById("d"+i).style.background="var(--red)";
    setTimeout(()=>{ window.pc(); for(let i=0;i<4;i++) document.getElementById("d"+i).style.background=""; document.getElementById("pin-err").textContent=""; },700);
  }
}
window.logout = () => {
  if(unsub) unsub();
  document.getElementById("app").style.display="none";
  document.getElementById("lock").style.display="flex";
  window.pc();
};

// ── SYNC ──
function startSync(){
  unsub = onSnapshot(collection(fsdb, COLL), snap => {
    library = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderHome();
  });
}

// ── EXTRACT FOLDER ID ──
function extractFolderId(url){
  const m = url.match(/folders\/([a-zA-Z0-9_-]+)/);
  return m ? m[1] : url.trim();
}

// ── GOOGLE DRIVE API ──
async function listFolder(folderId){
  const url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&orderBy=name&key=${API_KEY}`;
  const r = await fetch(url);
  const d = await r.json();
  if(d.error) throw new Error(d.error.message);
  return d.files || [];
}

function getImageUrl(fileId){
  return `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
}

// ── HOME ──
function renderHome(){
  const grid = document.getElementById("manga-list");
  const empty = document.getElementById("empty-msg");
  if(!library.length){ grid.innerHTML=""; empty.style.display="block"; return; }
  empty.style.display="none";
  grid.innerHTML = `<div class="manga-grid">${library.map(m=>{
    const prog = m.totalCh>0 ? Math.round((m.lastCh||0)/m.totalCh*100) : 0;
    const cover = m.cover
      ? `<img class="manga-cover" src="${m.cover}" onerror="this.outerHTML='<div class=manga-cover-placeholder>📖</div>'"/>`
      : `<div class="manga-cover-placeholder">📖</div>`;
    return `<div class="manga-card" onclick="openManga('${m.id}')">
      ${cover}
      <div class="manga-info">
        <div class="manga-name">${m.name}</div>
        <div class="manga-ch">فصل ${m.lastCh||0} ${m.totalCh?'/ '+m.totalCh:''}</div>
        ${m.totalCh>0?`<div class="progress-mini"><div class="progress-mini-fill" style="width:${prog}%"></div></div>`:''}
      </div>
    </div>`;
  }).join("")}</div>`;
}

// ── OPEN MANGA ──
window.openManga = async function(id){
  const m = library.find(x=>x.id===id);
  if(!m) return;
  currentManga = m;
  document.getElementById("home").style.display="none";
  document.getElementById("chapter-view").style.display="block";
  document.getElementById("cv-title").textContent = m.name;
  document.getElementById("cv-sub").textContent = "جاري تحميل الفصول...";
  document.getElementById("cv-cover").src = m.cover||"";
  document.getElementById("chapters-grid").innerHTML = `<div class="loading"><div class="spinner"></div><div>جاري التحميل...</div></div>`;

  try {
    const folderId = extractFolderId(m.driveUrl);
    const files = await listFolder(folderId);
    const folders = files.filter(f=>f.mimeType==="application/vnd.google-apps.folder")
      .sort((a,b)=>naturalSort(a.name,b.name));

    if(!folders.length){
      document.getElementById("chapters-grid").innerHTML = `<div class="empty-state"><div>ما لقينا فصول — تأكد إن المجلد فيه مجلدات فصول</div></div>`;
      return;
    }

    currentChapters = folders;
    // update total
    if(m.totalCh !== folders.length){
      await setDoc(doc(fsdb,COLL,id),{...m,totalCh:folders.length},{merge:true});
    }

    document.getElementById("cv-sub").textContent = `${folders.length} فصل`;
    document.getElementById("chapters-grid").innerHTML = folders.map((f,i)=>{
      const isRead = (m.lastCh||0) > i;
      return `<button class="ch-btn ${isRead?'read':''}" onclick="openChapter(${i})">${f.name}</button>`;
    }).join("");
  } catch(e){
    document.getElementById("chapters-grid").innerHTML = `<div class="empty-state"><div>خطأ في التحميل: ${e.message}</div></div>`;
  }
};

// ── OPEN CHAPTER ──
window.openChapter = async function(chIndex){
  currentChIndex = chIndex;
  const ch = currentChapters[chIndex];
  document.getElementById("chapter-view").style.display="none";
  document.getElementById("reader").style.display="flex";
  document.getElementById("reader-title").textContent = `${currentManga.name} — ${ch.name}`;
  document.getElementById("reader-body").innerHTML = `<div class="loading" style="min-height:300px"><div class="spinner"></div><div>جاري تحميل الصور...</div></div>`;

  try {
    const files = await listFolder(ch.id);
    const images = files.filter(f=>f.mimeType.startsWith("image/"))
      .sort((a,b)=>naturalSort(a.name,b.name));

    if(!images.length){
      document.getElementById("reader-body").innerHTML = `<div class="loading"><div>ما لقينا صور في هذا الفصل</div></div>`;
      return;
    }

    currentPages = images;
    document.getElementById("reader-body").innerHTML = images.map((img,i)=>
      `<img class="page-img" src="${getImageUrl(img.id)}" loading="lazy" onload="updateCounter()" alt="صفحة ${i+1}"/>`
    ).join("");

    document.getElementById("reader-body").scrollTop = 0;
    updateCounter();

    // save progress
    const newLastCh = Math.max(currentManga.lastCh||0, chIndex+1);
    if(newLastCh !== (currentManga.lastCh||0)){
      await setDoc(doc(fsdb,COLL,currentManga.id),{...currentManga,lastCh:newLastCh},{merge:true});
      currentManga.lastCh = newLastCh;
    }
  } catch(e){
    document.getElementById("reader-body").innerHTML = `<div class="loading"><div>خطأ: ${e.message}</div></div>`;
  }
};

window.updateCounter = function(){
  const imgs = document.querySelectorAll("#reader-body .page-img");
  const loaded = [...imgs].filter(i=>i.complete&&i.naturalHeight>0).length;
  document.getElementById("page-counter").textContent = `${loaded} / ${currentPages.length} صفحة`;
};

window.nextCh = function(){
  if(currentChIndex < currentChapters.length-1) openChapter(currentChIndex+1);
  else notify("هذا آخر فصل متاح ✓");
};
window.prevCh = function(){
  if(currentChIndex > 0) openChapter(currentChIndex-1);
  else notify("هذا أول فصل");
};
window.closeReader = function(){
  document.getElementById("reader").style.display="none";
  document.getElementById("chapter-view").style.display="block";
};
window.goHome = function(){
  document.getElementById("chapter-view").style.display="none";
  document.getElementById("home").style.display="block";
  currentManga=null; currentChapters=[];
};

// ── ADD MANGA ──
window.showAddModal = function(){
  document.getElementById("add-modal").style.display="flex";
  setTimeout(()=>document.getElementById("m-name").focus(),100);
};
window.closeModal = function(){ document.getElementById("add-modal").style.display="none"; };
window.closeOutside = function(e){ if(e.target===document.getElementById("add-modal")) closeModal(); };

window.addManga = async function(){
  const name = document.getElementById("m-name").value.trim();
  const url = document.getElementById("m-url").value.trim();
  const cover = document.getElementById("m-cover").value.trim();
  if(!name||!url){ notify("اكتب الاسم والرابط"); return; }
  const id = "manga_"+Date.now();
  try{
    await setDoc(doc(fsdb,COLL,id),{ name, driveUrl:url, cover, lastCh:0, totalCh:0, addedAt:Date.now() });
    window.closeModal();
    document.getElementById("m-name").value="";
    document.getElementById("m-url").value="";
    document.getElementById("m-cover").value="";
    notify("تمت الإضافة ✓");
  }catch(e){ notify("خطأ: "+e.message); }
};

// ── UTILS ──
function naturalSort(a,b){
  return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'});
}
function notify(msg){
  const n=document.createElement("div"); n.className="notif"; n.textContent=msg;
  document.body.appendChild(n); setTimeout(()=>n.remove(),2200);
}

document.addEventListener("keydown",e=>{
  if(document.getElementById("lock").style.display!=="none"){
    if(e.key>="0"&&e.key<="9") window.pp(parseInt(e.key));
    if(e.key==="Backspace") window.pd();
    if(e.key==="Escape") window.pc();
  }
  if(e.key==="Escape") window.closeModal();
});
</script>
